# --- FILE: frontend/nginx.conf ---
# SPA static files + a proxy of the API and WebSocket to the api service (docker-compose.prod.yml).
# Port 80 is for an external proxy or load balancer and health checks. HTTPS on the server itself (behind Cloudflare, Full
# strict mode) is a separate server in nginx-tls.conf, included by docker-compose.tls.yml; the routes are shared
# (nginx_locations.inc). The client address behind Cloudflare is taken from CF-Connecting-IP (the file cloudflare_real_ip.inc, prepared
# by scripts/deploy/cloudflare_ips.sh; without the file, the connection address, as before).

# Upgrade is for WebSocket; for ordinary requests an empty Connection preserves keepalive to the API.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# The api address is re-resolved from Docker DNS (127.0.0.11) rather than taken once at nginx start:
# an API container recreated on deploy or crashed and restarted may get a new IP,
# and nginx with the old address would return 502 for everything until restarted manually.
resolver 127.0.0.11 valid=10s ipv6=off;

# Strict-Transport-Security only on HTTPS requests: with an empty value nginx does not send the header.
# The term is 30 days at launch; once HTTPS is verified, raise it to a year (31536000).
map $scheme $hsts_value {
    https   "max-age=2592000; includeSubDomains";
    default "";
}

upstream regence_api {
    zone regence_api 64k;
    server api:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # The real client address from Cloudflare (if the file is included); a wildcard so that nginx still starts without the file.
    include /etc/nginx/conf.d/cloudflare*.inc;

    # --- Security headers (add_header in a location cancels inherited ones, so they
    #     are moved to a separate file and included in every location with its own add_header).
    include /etc/nginx/conf.d/security_headers.inc;

    include /etc/nginx/conf.d/nginx_locations.inc;
}
