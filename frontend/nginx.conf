# --- FILE: frontend/nginx.conf ---
# Статика SPA + прокси API и WebSocket на сервис api (docker-compose.prod.yml).
# Порт 80 — для внешнего прокси или балансировщика и проверок здоровья. HTTPS на самом сервере (за Cloudflare, режим
# Full strict) — отдельный server в nginx-tls.conf, подключается docker-compose.tls.yml; маршруты у них общие
# (nginx_locations.inc). Адрес клиента за Cloudflare берётся из CF-Connecting-IP (файл cloudflare_real_ip.inc, его
# готовит scripts/deploy/cloudflare_ips.sh; нет файла — адрес соединения, как раньше).

# Upgrade — для WebSocket; для обычных запросов пустой Connection сохраняет keepalive до API.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# Адрес api перечитывается из DNS Docker (127.0.0.11), а не берётся один раз при старте nginx:
# пересозданный при деплое или упавший и перезапущенный контейнер API может получить новый IP,
# и nginx со старым адресом отдавал бы 502 на всё, пока его не перезапустят вручную.
resolver 127.0.0.11 valid=10s ipv6=off;

# Strict-Transport-Security только на HTTPS-запросах: при пустом значении nginx заголовок не отправляет.
# Срок — 30 суток на старте; когда HTTPS проверен, поднять до года (31536000).
map $scheme $hsts_value {
    https   "max-age=2592000; includeSubDomains";
    default "";
}

upstream regence_api {
    zone regence_api 64k;
    server api:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Настоящий адрес клиента от Cloudflare (если файл подключён); wildcard — чтобы без файла nginx всё равно стартовал.
    include /etc/nginx/conf.d/cloudflare*.inc;

    # --- Заголовки безопасности (add_header в location отменяет унаследованные, поэтому
    #     вынесены в отдельный файл и подключаются в каждом location со своими add_header).
    include /etc/nginx/conf.d/security_headers.inc;

    include /etc/nginx/conf.d/nginx_locations.inc;
}
