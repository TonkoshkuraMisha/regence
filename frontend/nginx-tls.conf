# --- FILE: frontend/nginx-tls.conf ---
# HTTPS на самом сервере: Cloudflare (Full strict) ходит на origin по 443 с сертификатом Cloudflare Origin CA.
# Подключается docker-compose.tls.yml как conf.d/tls.conf; сертификат и ключ — deploy/certs/origin.pem и origin.key
# (создаются в панели Cloudflare: SSL/TLS → Origin Server; в репозиторий не попадают). Маршруты и заголовки — общие с
# портом 80 (nginx_locations.inc, security_headers.inc); HSTS отправляется автоматически на этом порту.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:tls:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    include /etc/nginx/conf.d/cloudflare*.inc;
    include /etc/nginx/conf.d/security_headers.inc;
    include /etc/nginx/conf.d/nginx_locations.inc;
}
