# --- FILE: frontend/nginx-tls.conf ---
# HTTPS on the server itself: Cloudflare (Full strict) connects to the origin on 443 with a Cloudflare Origin CA certificate.
# Included by docker-compose.tls.yml as conf.d/tls.conf; the certificate and key are deploy/certs/origin.pem and origin.key
# (created in the Cloudflare panel: SSL/TLS -> Origin Server; they do not go into the repository). Routes and headers are shared with
# port 80 (nginx_locations.inc, security_headers.inc); HSTS is sent automatically on this port.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:tls:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    include /etc/nginx/conf.d/cloudflare*.inc;
    include /etc/nginx/conf.d/security_headers.inc;
    include /etc/nginx/conf.d/nginx_locations.inc;
}
