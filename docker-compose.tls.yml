# HTTPS on the server behind Cloudflare (SSL/TLS mode "Full (strict)"). Added on top of everything else:
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
# Before starting: deploy/certs/origin.pem and origin.key (Cloudflare -> SSL/TLS -> Origin Server -> Create Certificate) and
# deploy/cloudflare_real_ip.inc (`scripts/deploy/cloudflare_ips.sh nginx`). Details - DEPLOY.md, section 4.
# Port 80 stays: inside the compose network it is needed for health checks, from outside the firewall closes it (cloudflare_ips.sh ufw).
services:
  web:
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend/nginx-tls.conf:/etc/nginx/conf.d/tls.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/cloudflare_real_ip.inc:/etc/nginx/conf.d/cloudflare_real_ip.inc:ro
