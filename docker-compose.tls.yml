# HTTPS на сервере за Cloudflare (режим SSL/TLS «Full (strict)»). Добавляется ко всему остальному:
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
# Перед запуском: deploy/certs/origin.pem и origin.key (Cloudflare → SSL/TLS → Origin Server → Create Certificate) и
# deploy/cloudflare_real_ip.inc (`scripts/deploy/cloudflare_ips.sh nginx`). Подробности — DEPLOY.md, раздел 4.
# Порт 80 остаётся: внутри сети compose он нужен проверкам здоровья, снаружи его закрывает файрвол (cloudflare_ips.sh ufw).
services:
  web:
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend/nginx-tls.conf:/etc/nginx/conf.d/tls.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/cloudflare_real_ip.inc:/etc/nginx/conf.d/cloudflare_real_ip.inc:ro
