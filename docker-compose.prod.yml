# --- FILE: docker-compose.prod.yml ---
# Production: docker compose -f docker-compose.prod.yml up -d --build
# Settings and secrets are in .env (template .env.example, instructions - DEPLOY.md).
#
# Only web (nginx, port 80) is exposed outside: the API, DB and Redis are reachable only inside the compose network.
# So the API may trust X-Forwarded-For from any address of this network (FORWARDED_ALLOW_IPS).

# The project name is set explicitly: volumes and the network are named regence_*, not after the folder name.
name: regence

x-backend: &backend
  build: .
  image: regence-backend:latest
  env_file: .env
  environment: &backend-env
    ENVIRONMENT: production
    POSTGRES_SERVER: db
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  restart: unless-stopped
  # Container console - json lines from src/core/logging_setup.py; the driver keeps 5 files of 20 MB and rotates them itself.
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # AOF: the state of running games and the Celery queue survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-off service: applies migrations before the API and workers start and loads the puzzle database (re-running is safe).
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.import_puzzles"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      ENVIRONMENT: production
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      FORWARDED_ALLOW_IPS: "*"
      # Prometheus metrics are summed over all uvicorn processes through files in this directory.
      # tmpfs is cleared on every container start - values of dead processes do not accumulate.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs:
      - /tmp/prometheus:mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Background analysis of finished games (Stockfish).
  worker:
    <<: *backend
    command: ["celery", "-A", "src.worker.celery_app", "worker", "--loglevel=INFO",
              "--concurrency=${CELERY_CONCURRENCY:-2}", "-Q", "analysis", "-n", "analysis@%h"]
    # Background analysis metrics (engine time) - on worker:9101/metrics; its own tmpfs, not shared with api: process
    # numbers in containers coincide (src/core/observability.start_worker_metrics_server).
    # The service environment replaces the shared one entirely (YAML merge is shallow), so the shared one is mixed in explicitly.
    environment: &worker-metrics
      <<: *backend-env
      WORKER_METRICS_PORT: "9101"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs:
      - /tmp/prometheus:mode=1777
    # Stockfish takes all available cores; without a limit, game analysis takes CPU from the API, and on
    # mass game completion the move-latency p95 grew from ~70 to ~230 ms (scripts/loadtest).
    cpus: ${WORKER_CPUS:-1.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Bot-vs-bot games in tournaments (task 15.2) - a separate queue and a separate worker (task A.4): a tournament of 8
  # (up to 28 games) does not delay the analysis of player games. One game at a time and its own CPU limit.
  worker-simulation:
    <<: *backend
    command: ["celery", "-A", "src.worker.celery_app", "worker", "--loglevel=INFO",
              "--concurrency=${SIMULATION_CONCURRENCY:-1}", "-Q", "simulation", "-n", "simulation@%h"]
    environment: *worker-metrics
    tmpfs:
      - /tmp/prometheus:mode=1777
    cpus: ${SIMULATION_CPUS:-0.5}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery scheduled tasks (DEPLOY.md, section 8c): a daily warm-up reminder, bot self-play every
  # 6 hours, arena start reminders every minute. One beat process for the whole stack.
  beat:
    <<: *backend
    command: ["celery", "-A", "src.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    cpus: 0.1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Database backups: pg_dump right at start and then every BACKUP_INTERVAL_HOURS hours
  # into the host folder BACKUP_DIR; copies older than BACKUP_KEEP_DAYS days are deleted (DEPLOY.md, section 5).
  backup:
    image: postgres:16-alpine
    entrypoint: ["sh", "/usr/local/bin/pg_backup.sh"]
    command: ["loop"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_VERIFY_EVERY_DAYS: ${BACKUP_VERIFY_EVERY_DAYS:-7}
      BACKUP_ALERT_WEBHOOK_URL: ${BACKUP_ALERT_WEBHOOK_URL:-}
    volumes:
      - ./scripts/backup/pg_backup.sh:/usr/local/bin/pg_backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Off-server copy of snapshots (rclone: S3, Backblaze B2, Google Drive, SFTP, etc.). Enabled by a profile:
  #   docker compose -f docker-compose.prod.yml --profile offsite up -d
  # The `offsite` remote is described by RCLONE_CONFIG_OFFSITE_* variables in .env (DEPLOY, section 5); until they exist,
  # the service is not needed. Only finished regence_*.dump files are copied: `.partial` and service files are skipped.
  backup-offsite:
    image: rclone/rclone:1.68.2
    profiles: ["offsite"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          rclone copy /backups "$${BACKUP_OFFSITE_PATH:?}" --include 'regence_*.dump' --exclude '*'             || echo "backup-offsite: ERROR: rclone copy failed"
          sleep "$$(( $${BACKUP_OFFSITE_INTERVAL_HOURS:-24} * 3600 ))"
        done
    env_file: .env
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      - backup
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}  # page Sentry (project regence-web); empty - disabled
      secrets:
        - sentry_auth_token  # source maps to Sentry at build time; the token file is SENTRY_AUTH_TOKEN_FILE, empty by default
    image: regence-web:latest
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# The source-map upload token (Sentry -> Settings -> Auth Tokens, scopes project:releases and org:read) lives in a file outside
# the repository: SENTRY_AUTH_TOKEN_FILE=/path/to/file. If unset - an empty file, source maps are not produced.
secrets:
  sentry_auth_token:
    file: ${SENTRY_AUTH_TOKEN_FILE:-./frontend/sentry_token.empty}

volumes:
  postgres_data:
  redis_data:
